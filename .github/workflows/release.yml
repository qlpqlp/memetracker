name: Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (example 1.0.4). Leave empty to auto-bump patch from latest tag."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      should_release: ${{ steps.ver.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Using push tag ${TAG}"
            exit 0
          fi

          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [[ -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION#v}"
          else
            LATEST="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"
            if [[ -z "${LATEST}" ]]; then
              VERSION="1.0.0"
            else
              BASE="${LATEST#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE}"
              MAJOR="${MAJOR:-0}"
              MINOR="${MINOR:-0}"
              PATCH="${PATCH:-0}"
              VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
          fi

          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Resolved ${TAG}"

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; will publish/update release assets for it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
            echo "Created and pushed ${TAG}"
          fi

  build-release:
    needs: resolve-version
    if: needs.resolve-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Build dist binaries and SHA256SUMS
        env:
          MTR_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: bash scripts/build-release.sh

      - name: List artifacts
        run: ls -lah dist && cat dist/SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-version.outputs.tag }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="MemeTracker ${TAG}

          Cross-compiled binaries and SHA256SUMS are attached.

          Verify:
          \`\`\`bash
          sha256sum -c SHA256SUMS
          \`\`\`
          "
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
            gh release edit "${TAG}" --title "MemeTracker ${TAG}" --notes "${NOTES}"
          else
            gh release create "${TAG}" dist/* \
              --title "MemeTracker ${TAG}" \
              --notes "${NOTES}"
          fi
